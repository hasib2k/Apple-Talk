    <!-- Static content for search engine crawlers that don't run JavaScript -->
    <noscript>
      <div style="font-family:Arial,sans-serif;max-width:800px;margin:40px auto;padding:20px;color:#111;">
        <h1>AppleTalk — Group Audio Meetings</h1>
        <p>AppleTalk is a group audio meeting platform. Create a meeting link, share it, and thousands can join and listen while speakers talk — audio only, no camera.</p>

        <h2>How It Works</h2>
        <ol>
          <li><strong>Create a meeting</strong> — Tap "New meeting" and get a shareable room link instantly.</li>
          <li><strong>Share the link</strong> — Anyone can open it in a browser and join in seconds.</li>
          <li><strong>Host the room</strong> — Speakers talk, the audience raises hands to join in, and you moderate as host.</li>
        </ol>

        <h2>Features</h2>
        <ul>
          <li>Shareable meeting links</li>
          <li>Audio only — no camera, ever</li>
          <li>Scales to thousands of participants</li>
          <li>Raise hand to speak</li>
          <li>Host controls — mute, promote, remove, end</li>
          <li>Host-gated text chat and live emoji reactions</li>
          <li>Join from any browser — no download</li>
        </ul>

        <p><a href="https://www.appletalk.live">Visit appletalk.live to start a meeting</a></p>
      </div>
    </noscript>
